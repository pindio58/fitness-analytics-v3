alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [ "alertname", "cluster", "namespace" ]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Forward MinIO alerts to webhook
        - receiver: "webhook"
          match:
            alertname: MinIODown
        # Add more matchers as needed, e.g., for other alerts
        # - receiver: 'webhook'
        #   match_re:
        #     alertname: .*
    receivers:
      - name: "null"
      - name: "webhook"
        webhook_configs:
          - url: "https://webhook.site/<your unique id>"
            send_resolved: true
